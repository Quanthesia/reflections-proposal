body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font: 16px/1.5 "Helvetica Neue", Arial, sans-serif; padding: 0 20px; }

p { margin: 0; color: var(--muted); font-size: 14px; }
form { display: grid; gap: 10px; }
input { font: inherit; padding: 9px 11px; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); color: var(--ink); }
button { font: inherit; font-weight: 600; padding: 9px 11px; border: 0; border-radius: 4px; background: var(--ink); color: var(--paper); cursor: pointer; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.err { color: #c0392b; font-size: 14px; }
</style>

function b64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
async function unlock(code) {
  var enc = new TextEncoder();
  var base = await crypto.subtle.importKey("raw", enc.encode(code), "PBKDF2", false, ["deriveKey"]);
  var key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(P.salt), iterations: P.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.data));
  var html = new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
}
function showGate(failed) {
  document.getElementById("wait").hidden = true;
  document.getElementById("gate").hidden = false;
  document.getElementById("err").hidden = !failed;
  document.getElementById("code").focus();
}
document.getElementById("f").addEventListener("submit", function (e) {
  e.preventDefault();
  var c = document.getElementById("code").value.trim();
  unlock(c).then(function () {
    try { var u = new URL(location.href); u.searchParams.set("access", c); history.replaceState(null, "", u); } catch (x) {}
  }).catch(function () { showGate(true); });
});
var given = new URLSearchParams(location.search).get("access") || new URLSearchParams(location.hash.slice(1)).get("access");
if (given) unlock(given).catch(function () { showGate(true); }); else showGate(false);
